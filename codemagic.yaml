workflows:
  android-release:
    name: Android Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - crg_upload
      groups:
        - Secret
      flutter: stable
      vars:
        BUILD_NAME: 6.0.2
        BUILD_NUMBER: 28
    scripts:
      - name: Create google-services.json
        script: |
          if [ -f android/app/google-services.json ]; then
            echo "Using android/app/google-services.json from repository"
          elif [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Created google-services.json from GOOGLE_SERVICES_JSON_BASE64"
          else
            echo "ERROR: android/app/google-services.json missing and GOOGLE_SERVICES_JSON_BASE64 is empty."
            exit 1
          fi
          test -f android/app/google-services.json || (echo "google-services.json not found" && exit 1)
      - name: Set up Android signing
        script: |
          set -e
          KEYSTORE_PATH=""
          STORE_PASS=""
          KEY_PASS=""
          KEY_ALIAS_NAME="upload"

          if [ -n "${CM_KEYSTORE_PATH:-}" ] && [ -f "$CM_KEYSTORE_PATH" ]; then
            echo "Using Codemagic keystore: $CM_KEYSTORE_PATH"
            KEYSTORE_PATH="$CM_KEYSTORE_PATH"
            STORE_PASS="$CM_KEYSTORE_PASSWORD"
            KEY_PASS="$CM_KEY_PASSWORD"
            KEY_ALIAS_NAME="$CM_KEY_ALIAS"
          elif [ -n "${CM_KEYSTORE:-}" ]; then
            echo "Using CM_KEYSTORE (base64)"
            KEYSTORE_PATH="/tmp/upload-keystore.jks"
            printf '%s' "$CM_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASS="$CM_KEYSTORE_PASSWORD"
            KEY_PASS="$CM_KEY_PASSWORD"
            KEY_ALIAS_NAME="${CM_KEY_ALIAS:-upload}"
          elif [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using ANDROID_KEYSTORE_BASE64 from Secret"
            KEYSTORE_PATH="/tmp/upload-keystore.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD in Secret}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            KEY_ALIAS_NAME="${ANDROID_KEY_ALIAS:-upload}"
          else
            echo "ERROR: Android signing is not configured."
            echo "Option A (recommended): Codemagic → Team settings → Code signing identities"
            echo "  Upload android/app/upload-crgtransp72appkeystore.jks, reference name: crg_upload"
            echo "  Alias: upload"
            echo "Option B: Secret group variables ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS=upload"
            exit 1
          fi

          cat > "$CM_BUILD_DIR/android/key.properties" << EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS_NAME
          storeFile=$KEYSTORE_PATH
          EOF
      - name: Get Flutter packages
        script: |
          test -f lib/firebase_options.dart || (echo "ERROR: lib/firebase_options.dart missing" && exit 1)
          flutter pub get
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"
    artifacts:
      - build/**/outputs/**/*.aab

  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - Secret
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: ru.app72.crgtransp72app
        BUILD_NAME: 6.0.2
        BUILD_NUMBER: 28
        # APP_STORE_APPLE_ID — в группе Secret (числовой ID из App Store Connect → App Information)
    scripts:
      - name: Create GoogleService-Info.plist
        script: |
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: |
          test -f lib/firebase_options.dart || (echo "ERROR: lib/firebase_options.dart missing in repo (required by main.dart)" && exit 1)
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Create certificate private key
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY_BASE64" ]; then
            echo "CERTIFICATE_PRIVATE_KEY_BASE64 is empty. Add it to the Secret variable group in Codemagic."
            exit 1
          fi
          printf '%s' "$CERTIFICATE_PRIVATE_KEY_BASE64" | base64 --decode > /tmp/ios_distribution_private_key
          if ! grep -q "BEGIN.*PRIVATE KEY" /tmp/ios_distribution_private_key; then
            echo "CERTIFICATE_PRIVATE_KEY_BASE64 did not decode to a PEM private key."
            exit 1
          fi
          chmod 600 /tmp/ios_distribution_private_key
      - name: Fetch iOS signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/ios_distribution_private_key
      - name: Add signing certificates
        script: |
          keychain add-certificates
      - name: Apply code signing profiles
        script: |
          set -e
          echo "Provisioning profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || true
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --export-options-plist /Users/builder/export_options.plist \
            --archive-method app-store
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/Runner.xcodeproj/project.pbxproj \
            || (echo "Xcode bundle id does not match BUNDLE_ID=$BUNDLE_ID" && exit 1)
          test -f /Users/builder/export_options.plist || (echo "export_options.plist missing" && exit 1)
          plutil -lint /Users/builder/export_options.plist
          plutil -p /Users/builder/export_options.plist
      - name: Build iOS IPA
        script: |
          set -e
          set -o pipefail
          if ! flutter build ipa \
            --release \
            -t lib/main.dart \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --verbose 2>&1 | tee /tmp/flutter_build_ipa.log; then
            echo "=== flutter build ipa failed (last 120 lines) ==="
            tail -120 /tmp/flutter_build_ipa.log 2>/dev/null || true
            echo "=== xcodebuild logs ==="
            ls -la /tmp/xcodebuild_logs/ 2>/dev/null || true
            tail -150 /tmp/xcodebuild_logs/*.log 2>/dev/null || true
            exit 1
          fi
      - name: Configure App Store Connect upload
        script: |
          set -e
          IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "ERROR: IPA not found"
            exit 1
          fi
          BUILT_ID=$(unzip -p "$IPA" "Payload/Runner.app/Info.plist" | plutil -extract CFBundleIdentifier raw -)
          echo "IPA bundle id: $BUILT_ID (ожидается: $BUNDLE_ID)"
          if [ "$BUILT_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: bundle id в IPA не совпадает с BUNDLE_ID"
            exit 1
          fi
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "ERROR: APP_STORE_APPLE_ID не задан в группе Secret Codemagic."
            echo "App Store Connect → приложение с bundle $BUNDLE_ID → App Information → Apple ID"
            exit 1
          fi
          echo "ВАЖНО: APP_STORE_APPLE_ID должен быть от приложения с bundle $BUNDLE_ID,"
          echo "не от старого com.example.crgtransp72app"
          echo "APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS=--apple-id ${APP_STORE_APPLE_ID}" >> "$CM_ENV"
          echo "Upload Apple ID: ${APP_STORE_APPLE_ID}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
